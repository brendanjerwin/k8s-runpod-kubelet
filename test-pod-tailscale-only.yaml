apiVersion: v1
kind: Pod
metadata:
  name: test-runpod-tailscale-only
  labels:
    app: test-runpod-tailscale-only
spec:
  restartPolicy: Never
  nodeSelector:
    provider: runpod
  imagePullSecrets:
    - name: github-oci-registry-credentials
  containers:
    - name: tailscale-test
      image: ghcr.io/brendanjerwin/runpod-ml-base:latest
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "Starting Tailscale-only test..."
          echo "GPU info:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits || echo "GPU query failed"
          
          echo "Starting Tailscale manually..."
          export TS_USERSPACE=true
          export TS_STATE_DIR=/var/lib/tailscale
          export TS_ACCEPT_DNS=false
          
          # Create state directory
          mkdir -p "$TS_STATE_DIR"
          
          echo "Starting tailscaled in background..."
          tailscaled --statedir="$TS_STATE_DIR" --socket="$TS_STATE_DIR/tailscaled.sock" --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1025 &
          TAILSCALED_PID=$!
          echo "tailscaled started with PID $TAILSCALED_PID"
          
          # Wait for tailscaled to be ready
          echo "Waiting for tailscaled to be ready..."
          for i in {1..30}; do
            if tailscale --socket="$TS_STATE_DIR/tailscaled.sock" status >/dev/null 2>&1; then
              echo "tailscaled is ready"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "ERROR: tailscaled failed to start within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          
          # Authenticate with Tailscale
          echo "Authenticating with Tailscale..."
          if tailscale --socket="$TS_STATE_DIR/tailscaled.sock" up --auth-key="$TAILSCALE_AUTH_KEY" --accept-routes=false --accept-dns=false --shields-up=false --timeout=60s; then
            echo "✅ Tailscale authentication successful!"
            
            echo "Connection status:"
            tailscale --socket="$TS_STATE_DIR/tailscaled.sock" status
            
            echo "Testing network connectivity to SigNoz..."
            if ping -c 3 signoz-otel.monster-orfe.ts.net; then
              echo "✅ SigNoz connectivity test passed!"
            else
              echo "❌ SigNoz connectivity test failed"
            fi
            
            echo "Keeping container alive for 10 minutes to observe in Tailscale admin..."
            sleep 600
          else
            echo "❌ Tailscale authentication failed"
            exit 1
          fi
      env:
        - name: TAILSCALE_AUTH_KEY
          valueFrom:
            secretKeyRef:
              name: runpod-tailscale-auth
              key: ephemeral_key
      resources:
        requests:
          memory: "2Gi"
        limits:
          memory: "4Gi"
  tolerations:
    - key: "virtual-kubelet.io/provider"
      operator: "Equal"
      value: "runpod"
      effect: "NoSchedule"